name: Automated Tests (3)

# PR runs only via UI CI Pipeline (PR-Pipeline.yml) so branch protection sees a single
# stage-3-automated-tests / integration-test check, not a duplicate direct PR run.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: UltimateCompanyDatabase
          # No password required for internal testing per user request
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --max-connections=300
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_NAME: UltimateCompanyDatabase
      DB_USER: root
      DB_PASSWORD: ""
      MYSQL_HOST: 127.0.0.1
      API_PORT: 4433
      NODE_ENV: test
      # Spring DB Connection env vars
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/UltimateCompanyDatabase?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

    steps:
      # Typescript-admin at repo root (PR branch on workflow_call, ref on workflow_dispatch).
      - name: Checkout Typescript Admin
        uses: actions/checkout@v4

      # ── 1. WAIT FOR MYSQL ──────────────────────────────────────────────────
      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null; then
              echo "MySQL is up!"
              break
            fi
            echo "Attempt $i/30 - MySQL not ready, waiting..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "❌ MySQL never became ready"
              exit 1
            fi
          done

      # ── 1b. WAIT FOR REDIS ─────────────────────────────────────────────────
      - name: Wait for Redis to be ready
        env:
          REDIS_HOST: ${{ env.REDIS_HOST }}
          REDIS_PORT: ${{ env.REDIS_PORT }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-tools
          echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}..."
          for i in {1..30}; do
            if redis-cli -h "${REDIS_HOST}" -p "${REDIS_PORT}" ping 2>/dev/null | grep -q PONG; then
              echo "Redis is up!"
              break
            fi
            echo "Attempt $i/30 - Redis not ready, waiting..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "❌ Redis never became ready"
              exit 1
            fi
          done

      # ── 2. CLONE DATABASE REPOSITORY ──────────────────────────────────────
      - name: Checkout MySQL Database Repo
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/MySql-Database
          path: database-repo
          ref: main
          token: ${{ secrets.GH_PAT }}

      # 2b. SET UP PYTHON (REQUIRED FOR PRODUCTS GENERATION) ──────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── 3. RUN DATABASE INITIALIZATION SCRIPTS ──────────────────────────────
      - name: Run Database Initialization Scripts
        env:
          MYSQL_PWD: "" # Root has no password
        run: |
          scripts=(
            "01 - User"
            "02 - PickupLocation"
            "03 - Todo"
            "04 - Promo"
            "05 - Message"
            "06 - Lead"
            "07 - Products"
            "08 - Packages"
            "09 - PurchaseOrder"
          )

          for dir in "${scripts[@]}"; do
            echo "--------------------------------------------------------"
            echo "Initializing: $dir"
            echo "--------------------------------------------------------"
            cd "database-repo/TestScripts/$dir"

            echo "Running Table Creation..."
            chmod +x Create_Tables.sh
            ./Create_Tables.sh

            echo "Running Test Data Insertion..."
            if [[ "$dir" == *"Products"* ]]; then
              echo "Custom implementation for Products..."
              # Step 2: Run global data insertion (categories, reviews)
              chmod +x Insert_Test_Data.sh
              ./Insert_Test_Data.sh

              # Step 3: Generate client-specific SQLs
              echo "Generating client inserts via python..."
              python3 generate_client_inserts.py

              # Step 4: Run all generated client SQLs
              echo "Running all generated client SQL files..."
              for f in client_inserts/*.sql; do
                [ -e "$f" ] || continue
                echo "Processing $f..."
                mysql -h 127.0.0.1 -u root --local-infile=1 UltimateCompanyDatabase < "$f"
              done
            elif [ -f "Insert_Test_Data.sh" ]; then
              chmod +x Insert_Test_Data.sh
              ./Insert_Test_Data.sh
            elif [ -f "Insert_Test_Data.sql" ]; then
              mysql -h 127.0.0.1 -u root UltimateCompanyDatabase < Insert_Test_Data.sql
            else
              echo "Warning: No test data script found in $dir"
            fi

            cd - > /dev/null
          done

      # ── 4. SET UP AND RUN API ──────────────────────────────────────────────
      - name: Checkout Spring API Repo
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/Spring-Api
          path: Spring-Api
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and Run Spring API
        working-directory: Spring-Api/SpringApi
        run: |
          # 1. Build the application
          mvn -B -ntp package -DskipTests

          # 2. Run the API in the background using the JAR for speed
          nohup java -jar target/*.jar \
            --spring.profiles.active=localhost \
            --server.port=4433 \
            --spring.data.redis.host="${REDIS_HOST}" \
            --spring.data.redis.port="${REDIS_PORT}" \
            --app.grid-flow-cache.enabled=true \
            > api.log 2>&1 &

          echo "Starting API on port 4433 (Redis ${REDIS_HOST}:${REDIS_PORT})..."

          # 3. Wait for the API to be ready (up to 120 seconds)
          for i in {1..60}; do
            if curl -sf http://localhost:4433/actuator/health > /dev/null 2>&1; then
              echo "API is up and running!"
              break
            fi
            echo "Attempt $i/60 - API not ready yet, waiting..."
            if [ $i -eq 60 ]; then
               echo "API failed to start in time. Logs:"
               cat api.log
               exit 1
            fi
            sleep 2
          done

      # ── 5. START TYPESCRIPT ADMIN (uses root checkout above) ─────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build and Start Typescript Admin Preview Server
        run: |
          npm ci || npm install
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 3000 > preview.log 2>&1 &

          echo "Waiting for Typescript Admin preview server on port 3000..."
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "Preview server is up!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Preview server failed to start. Logs:"
              cat preview.log || true
              exit 1
            fi
            sleep 2
          done

      # ── 6. CLONE AND RUN PLAYWRIGHT TESTS ─────────────────────────────
      - name: Checkout Playwright Automation Repo
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/Spring-PlayWright-Automation
          path: Spring-PlayWright-Automation
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('Spring-PlayWright-Automation/pom.xml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Prepare Playwright automation
        working-directory: Spring-PlayWright-Automation
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Installing Playwright Chromium (once for all flow suites)..."
          mvn -B -ntp exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"
          echo "Cleaning and compiling test sources (once for all flow suites)..."
          mvn -B -ntp clean test-compile -Plocal -Dtest.env=local -DskipTests

      # Login → Grid → View (suites sequential; tests within each suite parallel).
      # Step markers (▶️ STEP / ✅ PASSED STEP / ⏱ TEST START) stream to the job log via tee.
      - name: Login Flow Tests (parallel within suite)
        working-directory: Spring-PlayWright-Automation
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          FLOW_TEST_SKIP_COMPILE: "true"
          FLOW_TEST_LOG_DIR: flow-test-logs/login
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.github/scripts/run-parallel-flow-tests.sh"
          "${GITHUB_WORKSPACE}/.github/scripts/run-parallel-flow-tests.sh" \
            "Login Flow" \
            AdminToolTests.flows \
            "LoginFlowTests#test01_successfulLogin" \
            "LoginFlowTests#test02_unsuccessfulLogin_wrongPassword" \
            "LoginFlowTests#test03_unsuccessfulLogin_emailNotConfirmed" \
            "LoginFlowTests#test04_resetPassword_successful" \
            "LoginFlowTests#test05_resetPassword_unsuccessful" \
            "ClientLandingFlowTests#test01_clientLandingDisplaysAlphabeticalGridAndCounts" \
            "ClientLandingFlowTests#test02_paginationNavigatesThroughClientList" \
            "ClientLandingFlowTests#test03_filterClientsByName"

      - name: Grid Flow Tests (parallel within suite)
        working-directory: Spring-PlayWright-Automation
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          FLOW_TEST_SKIP_COMPILE: "true"
          FLOW_TEST_LOG_DIR: flow-test-logs/grid
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.github/scripts/run-parallel-flow-tests.sh"
          "${GITHUB_WORKSPACE}/.github/scripts/run-parallel-flow-tests.sh" \
            "Grid Flow" \
            AdminToolTests.flows.GridFlows \
            UsersFlowTests \
            UserGroupsFlowTests \
            LeadsFlowTests \
            PromosFlowTests \
            ProductsFlowTests \
            PackagesFlowTests \
            PickupLocationsFlowTests \
            MessagesFlowTests

      - name: View Flow Tests (parallel within suite)
        working-directory: Spring-PlayWright-Automation
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          FLOW_TEST_SKIP_COMPILE: "true"
          FLOW_TEST_LOG_DIR: flow-test-logs/view
        run: |
          chmod +x "${GITHUB_WORKSPACE}/.github/scripts/run-parallel-flow-tests.sh"
          "${GITHUB_WORKSPACE}/.github/scripts/run-parallel-flow-tests.sh" \
            "View Flow" \
            AdminToolTests.flows.ViewFlows \
            ViewUserFlowTests \
            ViewUserGroupFlowTests \
            ViewLeadFlowTests \
            ViewPromoFlowTests \
            ViewProductFlowTests \
            ViewPackageFlowTests \
            ViewPickupLocationFlowTests \
            ViewMessageFlowTests

      # ── 7. ARTIFACTS ───────────────────────────────────────────────────────
      - name: Upload flow test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-test-logs
          path: Spring-PlayWright-Automation/flow-test-logs/
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: Spring-PlayWright-Automation/target/
          if-no-files-found: ignore
