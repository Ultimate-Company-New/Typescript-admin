name: Automated Tests (3)

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: UltimateCompanyDatabase
          # No password required for internal testing per user request
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: UltimateCompanyDatabase
      DB_USER: root
      DB_PASSWORD: ""
      MYSQL_HOST: 127.0.0.1
      API_PORT: 4433
      NODE_ENV: test
      # Spring DB Connection env vars
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/UltimateCompanyDatabase?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 1. WAIT FOR MYSQL ──────────────────────────────────────────────────
      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null; then
              echo "MySQL is up!"
              break
            fi
            echo "Attempt $i/30 - MySQL not ready, waiting..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "❌ MySQL never became ready"
              exit 1
            fi
          done

      # ── 2. CLONE DATABASE REPOSITORY ──────────────────────────────────────
      - name: Checkout MySQL Database Repo
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/MySql-Database
          path: database-repo
          ref: main
          token: ${{ secrets.GH_PAT }}

      # 2b. SET UP PYTHON (REQUIRED FOR PRODUCTS GENERATION) ──────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ── 3. RUN DATABASE INITIALIZATION SCRIPTS ──────────────────────────────
      - name: Run Database Initialization Scripts
        env:
          MYSQL_PWD: "" # Root has no password
        run: |
          scripts=(
            "01 - User"
            "02 - PickupLocation"
            "03 - Todo"
            "04 - Promo"
            "05 - Message"
            "06 - Lead"
            "07 - Products"
            "08 - Packages"
            "09 - PurchaseOrder"
          )

          for dir in "${scripts[@]}"; do
            echo "--------------------------------------------------------"
            echo "Initializing: $dir"
            echo "--------------------------------------------------------"
            cd "database-repo/TestScripts/$dir"

            echo "Running Table Creation..."
            chmod +x Create_Tables.sh
            ./Create_Tables.sh

            echo "Running Test Data Insertion..."
            if [[ "$dir" == *"Products"* ]]; then
              echo "Custom implementation for Products..."
              # Step 2: Run global data insertion (categories, reviews)
              chmod +x Insert_Test_Data.sh
              ./Insert_Test_Data.sh

              # Step 3: Generate client-specific SQLs
              echo "Generating client inserts via python..."
              python3 generate_client_inserts.py

              # Step 4: Run all generated client SQLs
              echo "Running all generated client SQL files..."
              for f in client_inserts/*.sql; do
                [ -e "$f" ] || continue
                echo "Processing $f..."
                mysql -h 127.0.0.1 -u root --local-infile=1 UltimateCompanyDatabase < "$f"
              done
            elif [ -f "Insert_Test_Data.sh" ]; then
              chmod +x Insert_Test_Data.sh
              ./Insert_Test_Data.sh
            elif [ -f "Insert_Test_Data.sql" ]; then
              mysql -h 127.0.0.1 -u root UltimateCompanyDatabase < Insert_Test_Data.sql
            else
              echo "Warning: No test data script found in $dir"
            fi

            cd - > /dev/null
          done

      # ── 4. SET UP AND RUN API ──────────────────────────────────────────────
      - name: Checkout Spring API Repo
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/Spring-Api
          path: Spring-Api
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and Run Spring API
        working-directory: Spring-Api/SpringApi
        run: |
          # 1. Build the application
          mvn -B package -DskipTests

          # 2. Run the API in the background using the JAR for speed
          nohup java -jar target/*.jar --spring.profiles.active=localhost --server.port=4433 > api.log 2>&1 &

          echo "Starting API on port 4433..."

          # 3. Wait for the API to be ready (up to 120 seconds)
          for i in {1..60}; do
            if curl -sf http://localhost:4433/actuator/health > /dev/null 2>&1; then
              echo "API is up and running!"
              break
            fi
            echo "Attempt $i/60 - API not ready yet, waiting..."
            if [ $i -eq 60 ]; then
               echo "API failed to start in time. Logs:"
               cat api.log
               exit 1
            fi
            sleep 2
          done

      # ── 5. CLONE AND START TYPESCRIPT ADMIN ─────────────────────────────────
      - name: Checkout Typescript Admin
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/Typescript-admin
          path: Typescript-admin
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Typescript-admin/package-lock.json

      - name: Install and Start Typescript Admin Dev Server
        working-directory: Typescript-admin
        run: |
          npm ci || npm install
          # Start dev server in the background
          nohup npm run dev > dev.log 2>&1 &

          echo "Waiting for Typescript Admin dev server to start..."
          sleep 5
          cat dev.log || true

      # ── 6. CLONE AND RUN PLAYWRIGHT TESTS ─────────────────────────────
      - name: Checkout Playwright Automation Repo
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Company-New/Spring-PlayWright-Automation
          path: Spring-PlayWright-Automation
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Grid Flow Tests
        working-directory: Spring-PlayWright-Automation
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "Installing Playwright Chromium..."
          mvn -B exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"

          GRID_FLOW_PKG="AdminToolTests.flows.GridFlows"

          # Order matches Typescript-admin DashboardSidebar.tsx
          GRID_FLOW_TESTS=(
            UsersFlowTests
            UserGroupsFlowTests
            LeadsFlowTests
            PromosFlowTests
            ProductsFlowTests
            PackagesFlowTests
            PickupLocationsFlowTests
            MessagesFlowTests
          )

          mvn -B clean

          for test_class in "${GRID_FLOW_TESTS[@]}"; do
            echo "=========================================="
            echo "Running ${test_class}..."
            echo "=========================================="
            if ! mvn -B verify \
              -Plocal \
              -Dtest.env=local \
              -Dplaywright.browser=chromium \
              -Dplaywright.headless=true \
              -Dtest="${GRID_FLOW_PKG}.${test_class}"; then
              echo "❌ ${test_class} failed — stopping Grid Flow Tests (remaining suites skipped)"
              exit 1
            fi
            echo "✓ ${test_class} passed"
          done

          echo "✓ All Grid Flow tests passed"

      # ── 7. ARTIFACTS ────────────────────────────────────────────────────────
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: Spring-PlayWright-Automation/target/
          if-no-files-found: ignore
